name: howmuch-fastapi
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: howmuch
      POSTGRES_USER: howmuch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "howmuch", "-d", "howmuch"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://howmuch:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/howmuch
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8010}
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
volumes:
  postgres-data:
