# Activate only after certbot obtains howmuch.logme.cloud's certificate.
map $uri $howmuch_account_ip {
    default "";
    ~^/api/v1/(session|accounts(/me)?)/?$ $binary_remote_addr;
}
limit_req_zone $howmuch_account_ip zone=howmuch_account:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=howmuch_api:1m rate=5r/s;

server {
    listen 80;
    server_name howmuch.logme.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/howmuch-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://howmuch.logme.cloud$request_uri; }
}

server {
    listen 443 ssl;
    server_name howmuch.logme.cloud;
    ssl_certificate /etc/letsencrypt/live/howmuch.logme.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/howmuch.logme.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 96k;
    access_log off;

    location = /privacy {
        alias /var/www/howmuch-privacy/index.html;
        default_type text/html;
    }

    location ^~ /api/v1/ {
        limit_req zone=howmuch_account burst=4 nodelay;
        limit_req zone=howmuch_api burst=10 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8010;
    }

    location = /readyz { proxy_pass http://127.0.0.1:8010; }
    location / { return 404; }
}
